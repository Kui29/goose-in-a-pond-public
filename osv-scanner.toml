# ── A real vulnerability with no upstream fix ────────────────────────────────

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-03-31
reason = "rsa: Marvin Attack, key recovery through timing side channels (CVSS 5.9). No fixed version exists -- the fix requires a constant-time rewrite upstream. Reached transitively; GIAP does not perform RSA private-key operations on attacker-controlled timing paths. Named in security.yml's own comment. Re-check whether a fixed rsa release exists at the review date."

# ── Go: present in the module graph, not in the build ────────────────────────

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2027-03-31
reason = "golang.org/x/crypto/openpgp is unmaintained and unsafe by design; the advisory covers only the openpgp subpackages and has no fixed version because the guidance is to stop using it. native/pondnet does not: `go list -deps ./...` contains no openpgp package and `go mod why golang.org/x/crypto` reports 'main module does not need package golang.org/x/crypto'. govulncheck with the go.mod toolchain agrees -- 1 vulnerability in a required module, 0 called. The govulncheck step in embedded-go-audit is what proves this on every run."
