# Reviewed exceptions for osv-scanner.
#
# Every entry here is an advisory with NO upstream fix. Anything that has a
# fixed version is deliberately absent: an advisory you could upgrade away from
# does not belong in an ignore file, and putting it here would convert a real
# finding into a silent one.
#
# `ignoreUntil` is a review date, not a dismissal. When it passes the scanner
# reports the advisory again, which is the point -- an unmaintained crate that
# is still unmaintained a year later is worth re-deciding, not re-ignoring.
#
# Reviewed 2026-09-29. Checked against the scan on jarida-io/goose-in-a-pond
# main at that date; the fixed-version column was empty ("--") for all of them.

