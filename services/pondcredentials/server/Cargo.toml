[package]
name = "pondcredentials"
description = "Serves Apple Music developer tokens to ponds, so a household needs no Apple developer key."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pondcredentials"
path = "src/lib.rs"

[[bin]]
name = "pondcredentials"
path = "src/main.rs"

[dependencies]
pond-apple-token = { path = "../token" }
axum = "0.8"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
# rustls, not native-tls: the image has no OpenSSL. Matches the pond workspace's reqwest.
reqwest = { version = "0.13.2", default-features = false, features = ["form", "json", "rustls"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
aws-lc-rs = "1"
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
