[package]
name = "pond-adapters-uber"
description = "Uber Riders API: upfront fares, ride requests, status and cancellation on the member's own account"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
pond-core   = { path = "../pond-core" }
anyhow      = { workspace = true }
async-trait = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
urlencoding = { workspace = true }
# One renewal at a time: Uber may rotate the refresh token, and a second concurrent one would fail.
tokio       = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio    = { workspace = true }
wiremock = { workspace = true }
